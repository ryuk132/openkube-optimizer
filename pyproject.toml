[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[project]
name = "openkube-optimizer"
version = "0.1.0.dev0"
description = "Read-only Kubernetes resource analysis (repository foundation)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Luis Assis" }]
dependencies = [
    "h11==0.16.0",
    "kubernetes==36.0.3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
